<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bar-Ansicht</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Barkeeper</p>
          <h1 id="bar-name">Cocktail Bar</h1>
          <p class="subline" id="bar-status">Lade Status…</p>
        </div>
        <a class="bar-link" href="./index.html">Gäste-Ansicht</a>
      </header>

      <section class="panel">
        <div class="section-title">
          <h2>Bestellungen</h2>
          <span id="order-count">0</span>
        </div>
        <div id="orders-list" class="cocktail-list">
          <p class="empty-state">Noch keine Bestellungen.</p>
        </div>
      </section>
    </div>

    <script type="module" src="./js/bar.js"></script>
  </body>
</html>
