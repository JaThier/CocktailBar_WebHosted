<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cocktail Bar</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="bar-eyebrow">Private Cocktail Bar</p>
          <h1 id="bar-name">Cocktail Bar</h1>
          <p class="subline" id="bar-status">Lade Konfiguration…</p>
        </div>
        <a class="bar-link" href="./bar.html">Bar-Ansicht</a>
      </header>

      <section class="panel">
        <label class="field" for="guest-name">
          <span>Name / Tischnummer</span>
          <input id="guest-name" type="text" placeholder="z. B. Alex oder Tisch 3" />
        </label>

        <div class="filters" id="filter-group" role="group" aria-label="Filter"></div>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>Getränke</h2>
          <span id="cocktail-count">0</span>
        </div>
        <div id="cocktail-list" class="cocktail-list"></div>
      </section>

      <section class="panel cart-panel">
        <div class="section-title">
          <h2>Warenkorb</h2>
          <span id="cart-count">0</span>
        </div>
        <div id="cart-items" class="cart-items">Noch nichts ausgewählt.</div>
        <button id="order-button" class="primary-button" type="button">Bestellung senden</button>
      </section>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
