<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cocktail Bar</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="bar-eyebrow">Private Cocktail Bar</p>
          <h1 id="bar-name">Cocktail Bar</h1>
          <p class="subline" id="bar-status">Lade Konfiguration…</p>
        </div>
        <div class="topbar-actions">
          <a class="bar-link" id="bar-link" href="./bar.html">Bar-Ansicht</a>
          <a class="bar-link bar-link-secondary" id="museum-link" href="./bar-museum.html">Bar-Museum</a>
        </div>
      </header>

      <section class="panel">
        <div class="tab-list guest-view-tabs" role="tablist" aria-label="Kartenansicht">
          <button class="tab-button active" data-guest-view-tab="full" type="button">Vollständige Karte</button>
          <button class="tab-button" data-guest-view-tab="daily" type="button">Tageskarte</button>
          <button class="tab-button" data-guest-view-tab="orders" type="button">Bestellungen</button>
        </div>
      </section>

      <details class="panel filter-panel" id="guest-filter-panel">
        <summary class="filter-panel-summary">
          <span>Filter</span>
        </summary>
        <div class="filter-panel-body">
          <label class="filter-search-field">
            <span>Suche</span>
            <input id="filter-search" type="search" placeholder="Cocktail oder Zutat suchen" autocomplete="off" />
          </label>
          <div class="filters" id="filter-group" role="group" aria-label="Filter"></div>
        </div>
      </details>

      <section class="panel">
        <div class="section-title">
          <h2 id="cocktail-section-title">Cocktails</h2>
          <span id="cocktail-count">0</span>
        </div>
        <div class="cocktail-layout">
          <div id="cocktail-list" class="cocktail-list" aria-label="Cocktail-Liste"></div>
          <div id="cocktail-detail" class="cocktail-detail-panel">
            <p class="empty-state">Wähle einen Cocktail aus der Liste aus.</p>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
